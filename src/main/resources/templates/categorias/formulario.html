<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${titulo}">Categoría - SIGR</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
  <h1 th:text="${titulo}"></h1>
  <div th:if="${error}" class="alert error" th:text="${error}"></div>
  <form th:if="${categoriaId == null}" th:action="@{/categorias/nueva}" th:object="${form}" method="post">
    <div><label for="nombre">Nombre de la categoría</label><input id="nombre" th:field="*{nombre}" required/>
      <span class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span></div>
    <div><label><input type="checkbox" th:field="*{activa}"/> Categoría activa</label></div>
    <button type="submit">Guardar</button> <a th:href="@{/categorias}">Cancelar</a>
  </form>
  <form th:if="${categoriaId != null}" th:action="@{/categorias/{id}/editar(id=${categoriaId})}" th:object="${form}" method="post">
    <div><label for="nombre2">Nombre de la categoría</label><input id="nombre2" th:field="*{nombre}" required/>
      <span class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span></div>
    <div><label><input type="checkbox" th:field="*{activa}"/> Categoría activa</label></div>
    <button type="submit">Guardar cambios</button> <a th:href="@{/categorias}">Cancelar</a>
  </form>
</main>
</body>
</html>
