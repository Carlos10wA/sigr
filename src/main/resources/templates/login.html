<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Iniciar sesión - SIGR</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<main>
  <h1>Inicio de sesión</h1>
  <div th:if="${param.error}" class="alert error">Usuario o contraseña incorrectos.</div>
  <div th:if="${param.logout}" class="alert">Sesión cerrada correctamente.</div>
  <form th:action="@{/login}" method="post">
    <div>
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" required autofocus/>
    </div>
    <div>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required/>
    </div>
    <button type="submit">Ingresar</button>
  </form>
  <p><small>Ingrese con el usuario creado por el administrador. La contraseña inicial del administrador se define localmente mediante variable de entorno (ver README).</small></p>
</main>
</body>
</html>
