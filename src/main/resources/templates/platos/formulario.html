<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${titulo}">Plato - SIGR</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
  <h1 th:text="${titulo}"></h1>
  <div th:if="${error}" class="alert error" th:text="${error}"></div>
  <form th:if="${platoId == null}" th:action="@{/platos/nuevo}" th:object="${form}" method="post">
    <div><label for="nombre">Nombre del plato</label><input id="nombre" th:field="*{nombre}" required/>
      <span class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span></div>
    <div><label for="descripcion">Descripción breve</label><textarea id="descripcion" th:field="*{descripcion}" rows="3" required></textarea>
      <span class="field-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span></div>
    <div><label for="categoriaId">Categoría</label><select id="categoriaId" th:field="*{categoriaId}" required>
        <option value="">Seleccione una categoría activa</option>
        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
      </select>
      <span class="field-error" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></span></div>
    <div><label for="precio">Precio (COP)</label><input id="precio" type="number" step="0.01" min="0.01" th:field="*{precio}" required/>
      <span class="field-error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span></div>
    <div><label for="foto">Fotografía (archivo local, ej. bandeja-paisa.jpg)</label><input id="foto" th:field="*{foto}" placeholder="placeholder.jpg"/>
      <span class="field-error" th:if="${#fields.hasErrors('foto')}" th:errors="*{foto}"></span>
      <small>Si se deja vacío se usará la imagen de respaldo.</small></div>
    <div><label><input type="checkbox" th:field="*{disponible}"/> Disponible temporalmente</label></div>
    <div><label><input type="checkbox" th:field="*{activo}"/> Plato activo (desactivar oculta del catálogo y conserva historial)</label></div>
    <button type="submit">Guardar plato</button> <a th:href="@{/platos}">Cancelar</a>
  </form>
  <form th:if="${platoId != null}" th:action="@{/platos/{id}/editar(id=${platoId})}" th:object="${form}" method="post">
    <div><label for="nombre2">Nombre del plato</label><input id="nombre2" th:field="*{nombre}" required/>
      <span class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span></div>
    <div><label for="descripcion2">Descripción breve</label><textarea id="descripcion2" th:field="*{descripcion}" rows="3" required></textarea>
      <span class="field-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span></div>
    <div><label for="categoriaId2">Categoría</label><select id="categoriaId2" th:field="*{categoriaId}" required>
        <option value="">Seleccione una categoría activa</option>
        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
      </select>
      <span class="field-error" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></span></div>
    <div><label for="precio2">Precio (COP)</label><input id="precio2" type="number" step="0.01" min="0.01" th:field="*{precio}" required/>
      <span class="field-error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span></div>
    <div><label for="foto2">Fotografía (archivo local)</label><input id="foto2" th:field="*{foto}"/>
      <span class="field-error" th:if="${#fields.hasErrors('foto')}" th:errors="*{foto}"></span></div>
    <div><label><input type="checkbox" th:field="*{disponible}"/> Disponible temporalmente</label></div>
    <div><label><input type="checkbox" th:field="*{activo}"/> Plato activo</label></div>
    <button type="submit">Guardar cambios</button> <a th:href="@{/platos}">Cancelar</a>
  </form>
</main>
</body>
</html>
