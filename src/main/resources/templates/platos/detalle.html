<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${plato.nombre}">Plato - SIGR</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
  <h1 th:text="${plato.nombre}"></h1>
  <img class="plato-foto-detalle" th:src="${plato.foto}" th:alt="${plato.nombre}" onerror="this.onerror=null;this.src='/images/platos/placeholder.jpg';"/>
  <p th:text="${plato.descripcion}"></p>
  <p>Categoría: <span th:text="${plato.categoria.nombre}"></span></p>
  <p class="price" th:text="${'$' + #numbers.formatDecimal(plato.precio, 1, 'POINT', 2, 'COMMA') + ' COP'}"></p>
  <span th:if="${plato.disponible}" class="badge ok">Disponible</span>
  <span th:if="${!plato.disponible}" class="badge off">No disponible temporalmente</span>
  <span th:if="${!plato.activo}" class="badge off">Desactivado</span>
  <p><a th:href="@{/platos}">Volver al catálogo</a></p>
  <div sec:authorize="hasAuthority('ROLE_ADMINISTRADOR')">
    <a th:href="@{/platos/{id}/editar(id=${plato.id})}"><button type="button">Editar plato</button></a>
  </div>
</main>
</body>
</html>
