<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Configuración - SIGR</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
  <h1 th:text="${titulo}">Configuración del restaurante</h1>
  <div th:if="${mensaje}" class="alert" th:text="${mensaje}"></div>
  <div th:if="${error}" class="alert error" th:text="${error}"></div>
  <p><small>Ubicación del restaurante (no del dispositivo). Seleccione solo la ciudad: el país y la zona se derivan de ella.</small></p>
  <form th:action="@{/configuracion}" th:object="${form}" method="post">
    <div>
      <label for="ciudad">Ciudad</label>
      <select id="ciudad" th:field="*{ciudad}">
        <option value="">-- Seleccione --</option>
        <option th:each="c : ${ciudades}" th:value="${c.ciudad}" th:data-pais="${c.pais}" th:data-zona="${c.zona}" th:text="${c.ciudad + ' (' + c.pais + ')'}"></option>
      </select>
      <span class="field-error" th:if="${#fields.hasErrors('ciudad')}" th:errors="*{ciudad}"></span>
    </div>
    <div>
      <label for="pais">País (según la ciudad)</label>
      <input id="pais" type="text" readonly="readonly" th:value="${form.pais}" th:style="'background:#f5f5f5'"/>
    </div>
    <div>
      <label for="direccion">Dirección</label>
      <input id="direccion" type="text" placeholder="Calle 10 # 5-20" th:field="*{direccion}"/>
      <span class="field-error" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></span>
    </div>
    <div>
      <label for="zonaHoraria">Zona horaria (según la ciudad)</label>
      <input id="zonaHoraria" type="text" readonly="readonly" th:value="${form.zonaHoraria}" th:style="'background:#f5f5f5'"/>
    </div>
    <button type="submit">Guardar ubicación</button>
    <a th:href="@{/}">Cancelar</a>
  </form>
  <script>
    (function() {
      var ciudad = document.getElementById('ciudad');
      var pais = document.getElementById('pais');
      var zona = document.getElementById('zonaHoraria');
      function actualizar() {
        if (!ciudad || ciudad.selectedIndex <= 0) { return; }
        var opt = ciudad.options[ciudad.selectedIndex];
        if (pais) pais.value = opt.getAttribute('data-pais') || '';
        if (zona) zona.value = opt.getAttribute('data-zona') || '';
      }
      if (ciudad) ciudad.addEventListener('change', actualizar);
    })();
  </script>
</main>
</body>
</html>
