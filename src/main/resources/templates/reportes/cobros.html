<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cobros - SIGR</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" th:href="@{/css/print.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
  <h1>Cobros</h1>
  <p><small>Zona: <span th:text="${zona}"></span></small></p>
  <div th:if="${error}" class="alert error" th:text="${error}"></div>
  <form th:action="@{/reportes/cobros}" method="get">
    <div>
      <label for="desde">Fecha inicial</label>
      <input id="desde" type="date" name="desde" th:value="${desde}"/>
      <label for="hasta">Fecha final</label>
      <input id="hasta" type="date" name="hasta" th:value="${hasta}"/>
    </div>
    <button type="submit">Consultar</button>
    <a th:if="${desde != null and hasta != null}" th:href="@{/reportes/cobros/csv(desde=${desde},hasta=${hasta})}"><button type="button">Exportar CSV</button></a>
    <a th:if="${desde != null and hasta != null}" th:href="@{/reportes/cobros/xlsx(desde=${desde},hasta=${hasta})}"><button type="button">Descargar Excel</button></a>
    <button type="button" onclick="window.print()">Imprimir</button>
  </form>
  <div th:if="${resumen != null}">
    <p>Total cobrado: <b th:text="${'$' + #numbers.formatDecimal(resumen.total, 1, 'POINT', 2, 'COMMA') + ' COP'}"></b> ·
       Comprobantes pagados: <b th:text="${resumen.cantidad}"></b></p>
    <p>Efectivo: <span th:text="${'$' + #numbers.formatDecimal(resumen.efectivo, 1, 'POINT', 2, 'COMMA') + ' COP'}"></span> ·
       Tarjeta: <span th:text="${'$' + #numbers.formatDecimal(resumen.tarjeta, 1, 'POINT', 2, 'COMMA') + ' COP'}"></span> ·
       Transferencia: <span th:text="${'$' + #numbers.formatDecimal(resumen.transferencia, 1, 'POINT', 2, 'COMMA') + ' COP'}"></span></p>
    <p th:if="${#lists.isEmpty(resumen.detalle)}">No hay cobros en ese rango.</p>
    <div class="table-wrap" th:if="${!#lists.isEmpty(resumen.detalle)}">
      <table>
        <thead><tr><th>Comprobante</th><th>Pedido</th><th>Fecha de pago</th><th>Método</th><th>Importe</th></tr></thead>
        <tbody>
          <tr th:each="p : ${resumen.detalle}">
            <td th:text="${p.comprobante.numero}"></td>
            <td th:text="${p.comprobante.pedido.id}"></td>
            <td th:text="${#temporals.format(p.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${p.metodo.nombreES()}"></td>
            <td th:text="${'$' + #numbers.formatDecimal(p.importe, 1, 'POINT', 2, 'COMMA') + ' COP'}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
