<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pedidos - SIGR</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
  <h1>Pedidos</h1>
  <div th:if="${mensaje}" class="alert" th:text="${mensaje}"></div>
  <div th:if="${error}" class="alert error" th:text="${error}"></div>
  <p><a th:href="@{/pedidos/nuevo}"><button type="button">Nuevo pedido</button></a></p>
  <p th:if="${#lists.isEmpty(pedidos)}">No hay pedidos registrados.</p>
  <div class="table-wrap" th:if="${!#lists.isEmpty(pedidos)}">
    <table>
      <thead><tr><th>#</th><th>Fecha</th><th>Cliente</th><th>Estado</th><th>Total</th><th></th></tr></thead>
      <tbody>
        <tr th:each="p : ${pedidos}">
          <td th:text="${p.id}"></td>
          <td th:text="${#temporals.format(p.fechaCreacion, 'yyyy-MM-dd HH:mm')}"></td>
          <td th:text="${p.usuario.nombreCompleto}"></td>
          <td th:text="${p.estado.nombreES()}"></td>
          <td th:text="${'$' + #numbers.formatDecimal(p.total, 1, 'POINT', 2, 'COMMA') + ' COP'}"></td>
          <td><a th:href="@{/pedidos/{id}(id=${p.id})}">Ver detalle</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
