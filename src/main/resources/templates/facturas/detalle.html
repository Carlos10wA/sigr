<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Comprobante de venta - SIGR</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" th:href="@{/css/print.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="comprobante">
  <div class="no-print">
    <div th:if="${mensaje}" class="alert" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
  </div>
  <h1>Comprobante de venta — Sin validez fiscal</h1>
  <p>N.º: <b th:text="${comprobante.numero}"></b> · Pedido: <b th:text="${comprobante.pedido.id}"></b></p>
  <p>Cliente: <span th:text="${comprobante.clienteNombre}"></span> (<span th:text="${comprobante.clienteUsuario}"></span>)</p>
  <p>Ubicación del restaurante: <span th:text="${comprobante.ciudad + ', ' + comprobante.pais}"></span><span th:if="${comprobante.direccion != null and comprobante.direccion != ''}"> — <span th:text="${comprobante.direccion}"></span></span></p>
  <p>Fecha de emisión: <span th:text="${#temporals.format(comprobante.fechaEmision, 'dd/MM/yyyy HH:mm')}"></span> (<span th:text="${comprobante.ciudad}"></span>, <span th:text="${comprobante.pais}"></span>)</p>
  <p>Estado: <b th:text="${comprobante.estado.nombreES()}"></b></p>
  <div th:if="${comprobante.pago != null}">
    <p>Pago: <span th:text="${comprobante.pago.metodo.nombreES()}"></span> —
       <span th:text="${'$' + #numbers.formatDecimal(comprobante.pago.importe, 1, 'POINT', 2, 'COMMA') + ' COP'}"></span> —
       <span th:text="${#temporals.format(comprobante.pago.fechaHora, 'dd/MM/yyyy HH:mm')}"></span></p>
  </div>
  <div sec:authorize="hasAuthority('ROLE_ADMINISTRADOR')" th:if="${comprobante.estado.name() == 'PENDIENTE_DE_PAGO'}">
    <p><a th:href="@{/caja/pagos/nuevo(comprobanteId=${comprobante.id})}"><button type="button">Registrar pago</button></a></p>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Plato</th><th>Precio unitario</th><th>Cantidad</th><th>Subtotal</th></tr></thead>
      <tbody>
        <tr th:each="l : ${comprobante.lineas}">
          <td th:text="${l.nombrePlato}"></td>
          <td th:text="${'$' + #numbers.formatDecimal(l.precioUnitario, 1, 'POINT', 2, 'COMMA') + ' COP'}"></td>
          <td th:text="${l.cantidad}"></td>
          <td th:text="${'$' + #numbers.formatDecimal(l.subtotal, 1, 'POINT', 2, 'COMMA') + ' COP'}"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <p><b>Total: <span th:text="${'$' + #numbers.formatDecimal(comprobante.total, 1, 'POINT', 2, 'COMMA') + ' COP'}"></span></b></p>
  <div class="no-print">
    <p><button type="button" onclick="window.print()">Imprimir</button>
       <a th:href="@{/facturas}">Volver a comprobantes</a></p>
  </div>
</main>
</body>
</html>
