<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Mesas - SIGR</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
  <h1>Mesas</h1>
  <div th:if="${mensaje}" class="alert" th:text="${mensaje}"></div>
  <div th:if="${error}" class="alert error" th:text="${error}"></div>
  <p><a th:href="@{/mesas/nueva}"><button type="button">Nueva mesa</button></a></p>
  <p th:if="${#lists.isEmpty(mesas)}">No hay mesas registradas.</p>
  <div class="table-wrap" th:if="${!#lists.isEmpty(mesas)}">
    <table>
      <thead><tr><th>Nombre</th><th>Capacidad</th><th>Activa</th><th></th></tr></thead>
      <tbody>
        <tr th:each="m : ${mesas}">
          <td th:text="${m.nombre}"></td>
          <td th:text="${m.capacidad}"></td>
          <td th:text="${m.activa ? 'Sí' : 'No'}"></td>
          <td><a th:href="@{/mesas/{id}/editar(id=${m.id})}">Editar</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
