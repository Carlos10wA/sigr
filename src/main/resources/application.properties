spring.application.name=SIGR
server.port=8080

# H2 con persistencia en archivo (local)
spring.datasource.url=jdbc:h2:file:./data/sigrdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# H2 console solo local (protegida por Spring Security en etapas siguientes)
spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# Zona horaria America/Bogota
spring.jackson.time-zone=America/Bogota

# Thymeleaf cache desactivada en desarrollo
spring.thymeleaf.cache=false
